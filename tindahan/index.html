<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tindahan POS</title>
  <meta name="description" content="Offline point-of-sale, inventory, utang and cash ledger for small stores.">
  <meta name="theme-color" content="#0B3D91">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tindahan">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <h1 id="title">Tindahan POS</h1>
      <span id="net" class="pill">Online</span>
      <button class="iconbtn" data-act="settings" id="gear" aria-label="Settings"></button>
    </header>
    <main id="main"></main>
    <div id="cartbar" hidden></div>
    <nav id="nav" aria-label="Main"></nav>
  </div>
  <div id="sheets"></div>
  <div id="printarea" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Tindahan POS needs JavaScript.</noscript>
  <script src="app.js"></script>
</body>
</html>
